<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage 2</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
    <img src="bg.jpg" class="bg">

    <!-- TIMELINE -->
    <section id="timelineSlide" class="slide active">

        <h1>Our Story</h1>

        <div class="timelineWrapper">
            <svg viewBox="0 0 600 1200" class="curve">
                <path id="timelinePath"
                    d="M300 50
                       C200 200, 400 350, 300 500
                       C200 650, 400 800, 300 950"
                    fill="none"
                    stroke="#ff4f8b"
                    stroke-width="4"
                    stroke-linecap="round"/>
            </svg>

            <div class="events">
                <!-- JS inserts events -->
            </div>
        </div>

        <button id="toQuiz" class="primaryBtn">Continue ➜</button>

    </section>


    <!-- QUIZ -->
    <section id="quizSlide" class="slide">

        <h1>Chinnu or Subbu 💞</h1>

        <div class="quizCard">

            <div id="question" class="question"></div>

            <div id="options" class="options"></div>

            <div id="reaction" class="reaction"></div>

        </div>

    </section>

</div>

<script src="script.js"></script>
</body>
</html>
