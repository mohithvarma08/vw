<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story ❤️</title>

<style>
    html, body {
        margin:0;
        padding:0;
        height:100%;
        overflow:hidden;
        background:black;
    }

    #stageFrame {
        width:100vw;
        height:100vh;
        border:none;
    }
</style>
</head>

<body>

<iframe id="stageFrame" src="intro.html"></iframe>

<script>
    const frame = document.getElementById("stageFrame");

    function goToStage(stageName){
        switch(stageName){
            case "intro":
                frame.src = "intro.html";
                break;
            case "memories":
                frame.src = "memories.html";
                break;
            case "timeline":
                frame.src = "timeline.html";
                break;
            case "future":
                frame.src = "future.html";
                break;
            case "letter":
                frame.src = "letter.html";
                break;
        }
    }

    window.goToStage = goToStage;
</script>

</body>
</html>
