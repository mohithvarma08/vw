<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage 2</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<!-- ================= TIMELINE SLIDE ================= -->

<section id="timelineSlide" class="slide active">

<h1 class="mainTitle">Our Story</h1>

<div class="timelineContainer">

<svg class="curve" viewBox="0 0 600 2200" preserveAspectRatio="none">
<path id="timelinePath"
d="M300 0 
C 420 150, 180 300, 300 450
C 420 600, 180 750, 300 900
C 420 1050, 180 1200, 300 1350
C 420 1500, 180 1650, 300 1800
C 420 1950, 300 2100, 300 2200"
fill="none"
stroke="#ff4f9a"
stroke-width="4"
stroke-linecap="round"/>
</svg>

<div class="events">

</div>

</div>

<div class="timelineEnd">
<p>And this is just the beginning…</p>
<button id="toQuiz">Continue ➜</button>
</div>

</section>


<!-- ================= QUIZ SLIDE ================= -->

<section id="quizSlide" class="slide">

<h1 class="quizTitle">💞 Chinnu or Subbu 💞</h1>

<div class="quizCard">

<h2 id="question"></h2>

<div id="options"></div>

<p id="reaction"></p>

</div>

</section>

<script src="script.js"></script>
</body>
</html>
