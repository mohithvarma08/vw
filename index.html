<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever Valentine ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<!-- ================= LETTER SLIDE ================= -->
<section id="letterSlide" class="section active">

<h1 class="mainTitle">For You 💌</h1>

<div class="letterWrapper">
    <div class="envelope" onclick="openLetter()">💌</div>

    <div class="letterCard" id="letterCard">
        <p>
        You are the calm in my chaos.<br><br>
        You are the smile I didn’t know I needed.<br><br>
        Every memory with you feels safe, warm, real.<br><br>
        And if I had to choose again…<br>
        I would still choose you. Always. ❤️
        </p>

        <button class="mainBtn" onclick="goToQuestion()">Continue →</button>
    </div>
</div>

</section>


<!-- ================= QUESTION SLIDE ================= -->
<section id="questionSlide" class="section">

<div class="questionCard">
    <h2>
        After all this…<br><br>
        Will you be my forever Valentine? ❤️
    </h2>

    <div class="btnRow">
        <button onclick="celebrate()">YES 💖</button>
        <button onclick="celebrate()">ABSOLUTELY YES 💘</button>
    </div>
</div>

</section>


<!-- ================= CELEBRATION SLIDE ================= -->
<section id="celebrationSlide" class="section">

<h1 class="celebrateTitle">Happy Valentine’s Day ❤️</h1>
<div class="sticker">🥰💑💖</div>

<canvas id="confettiCanvas"></canvas>

</section>

<script src="script.js"></script>
</body>
</html>
